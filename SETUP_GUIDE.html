   OPTIONAL AMBIENT AUDIO SETUP
   ===================================================== -->

<!-- Add this inside the <body> tag in index.html if you want background music -->

<!-- Option 1: Using Ambient Music Library -->
<audio id="ambient-audio" preload="auto" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<!-- Option 2: Simple JavaScript Control -->
<script>
    // Ambient Audio Manager (optional)
    const AmbientAudio = {
        audio: null,
        enabled: false,

        init() {
            this.audio = document.getElementById('ambient-audio');
            if (this.audio) {
                this.audio.volume = 0.15; // Set to 15% volume
                
                // Try to play on user interaction
                document.addEventListener('click', () => this.play(), { once: true });
                document.addEventListener('touchstart', () => this.play(), { once: true });
            }
        },

        play() {
            if (this.audio && !this.enabled) {
                this.audio.play().catch(() => {
                    console.log('Audio autoplay prevented by browser');
                });
                this.enabled = true;
            }
        },

        pause() {
            if (this.audio) {
                this.audio.pause();
                this.enabled = false;
            }
        },

        setVolume(level) {
            if (this.audio) {
                this.audio.volume = Math.max(0, Math.min(1, level));
            }
        }
    };

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => AmbientAudio.init());
    } else {
        AmbientAudio.init();
    }
</script>

<!-- =====================================================
   PERFORMANCE MONITORING
   ===================================================== -->

<script>
    // Add this for basic performance metrics
    window.addEventListener('load', () => {
        const perfData = performance.getEntriesByType('navigation')[0];
        console.log('Performance Metrics:', {
            'DNS Lookup': perfData.domainLookupEnd - perfData.domainLookupStart,
            'TCP Connection': perfData.connectEnd - perfData.connectStart,
            'Page Load': perfData.loadEventEnd - perfData.loadEventStart,
            'Total Time': perfData.loadEventEnd - perfData.fetchStart
        });
    });
</script>
